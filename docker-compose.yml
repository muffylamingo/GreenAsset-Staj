# ============================================================
#  GreenAsset — Docker Compose
#  Kullanım:  docker compose up -d
#  Servisler: db (PostGIS) · pgadmin · backend (FastAPI)
# ============================================================

services:
  # ----------------------------------------------------------
  # 1) VERİTABANI — PostgreSQL 16 + PostGIS 3.4
  # ----------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: greenasset-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Dışarıdan (DBeaver, pgAdmin masaüstü) bağlanabilmek için
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: container silinse bile veri kalır
      - postgres_data:/var/lib/postgresql/data
      # Bu klasördeki .sql dosyaları İLK KURULUMDA otomatik çalışır
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # "DB hazır mı?" kontrolü — backend bunu bekleyecek
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - greenasset-net

  # ----------------------------------------------------------
  # 2) pgAdmin — tarayıcıdan veritabanı yönetimi
  #    http://localhost:5050
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: greenasset-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Tek kullanıcılı mod — her açılışta master parola sormasın
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Sunucu bağlantısı hazır tanımlı gelsin (elle eklemeye gerek kalmaz)
      - ./db/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - greenasset-net

  # ----------------------------------------------------------
  # 3) BACKEND — FastAPI
  #    http://localhost:8000/docs
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenasset-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Geliştirme kolaylığı: kodu değiştir → uvicorn otomatik yeniden başlar
      - ./backend:/app
      # Seed verileri (ilçe sınırları GeoJSON'u) — sadece okuma
      - ./db/seed:/app/seed_data:ro
    depends_on:
      db:
        condition: service_healthy
    # Migration'lar açılışta otomatik uygulanıyor.
    # Bu olmadan sıfırdan kurulumda hiç tablo oluşmaz ve "tek komutla
    # çalışsın" iddiası bozulur. Alembic zaten uygulanmış migration'ları
    # atlıyor, yani her açılışta güvenle çalışabilir.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Frontend, backend hazır olmadan başlamasın diye sağlık kontrolü
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - greenasset-net

  # ----------------------------------------------------------
  # 4) FRONTEND — React derlemesi, Nginx ile servis
  #    http://localhost:3000
  #
  #    Geliştirirken bunu kullanmıyoruz (`npm run dev` daha hızlı,
  #    anlık yenileme var). Bu servis "tek komutla ayağa kalksın"
  #    içindir: değerlendiren kişi npm kurmadan projeyi çalıştırır.
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenasset-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - greenasset-net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  greenasset-net:
    driver: bridge
