# ============================================================
#  Sürekli Entegrasyon (CI)
#
#  Ne yapar: her push ve pull request'te testleri OTOMATİK çalıştırır.
#
#  Neden gerekli: elle çalıştırılan test, eninde sonunda çalıştırılmayan
#  testtir — acelesi olan kimse çalıştırmaz. CI, "bende çalışıyordu"
#  cümlesini ortadan kaldırır: kod her seferinde temiz bir makinede,
#  sıfırdan kurulup test edilir.
# ============================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Aynı dal için yeni bir push gelirse, süren eski çalıştırmayı iptal et.
# Zaten geçersiz olan bir sonucu beklemenin anlamı yok.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  #  BACKEND — lint + 61 test
  # ----------------------------------------------------------
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    # Testler GERÇEK PostGIS'e karşı çalışıyor; ST_Within'i taklit etmek
    # anlamsız olurdu, test edilmesi gereken şey zaten onun kendisi.
    # Bu yüzden CI de gerçek bir PostGIS ayağa kaldırıyor.
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: greenasset
          POSTGRES_PASSWORD: greenasset_ci
          POSTGRES_DB: greenasset
        ports:
          - 5432:5432
        # Sağlık kontrolü olmadan testler veritabanı hazır olmadan başlar
        # ve rastgele hatalarla düşer.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # conftest.py bu adresten test veritabanının adresini türetiyor.
      DATABASE_URL: postgresql+psycopg://greenasset:greenasset_ci@localhost:5432/greenasset

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testler (pytest)
        run: python -m pytest -q

  # ----------------------------------------------------------
  #  FRONTEND — lint + derleme
  # ----------------------------------------------------------
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (install değil): package-lock.json'a birebir uyar,
      # sürümleri kendiliğinden yükseltmez. CI'da tekrarlanabilirlik şart.
      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # Derlemenin kendisi bir testtir: import hataları, eksik dosyalar ve
      # sözdizimi hataları burada yakalanır. Bu projede haritayı bozan
      # hata da yalnızca ÜRETİM derlemesinde ortaya çıkmıştı.
      - name: Derle
        run: npm run build

  # ----------------------------------------------------------
  #  DOCKER — "tek komutla çalışır" iddiasını doğrula
  # ----------------------------------------------------------
  docker:
    name: Docker derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose dosyası ortam değişkenlerini .env'den okuyor; depoda .env
      # yok (olmamalı da), o yüzden örnek dosyayı kullanıyoruz.
      - name: Örnek .env'i kullan
        run: cp .env.example .env

      # README "tek komutla çalışır" diyor. İmajlar derlenmiyorsa bu
      # iddia bozulur ve bunu ancak değerlendiren kişi fark eder.
      - name: İmajları derle
        run: docker compose build
