# ============================================================
#  Swagger (/docs, /redoc) için güvenlik başlıkları
#
#  Neden ayrı? Swagger arayüzü kendi dosyalarını bir CDN'den
#  (cdn.jsdelivr.net) yüklüyor ve sayfayı başlatan küçük bir satır içi
#  (inline) script kullanıyor. Ana uygulamanın CSP'si ikisine de izin
#  vermiyor — vermemeli de. Bu yüzden gevşetme SADECE bu yola özel.
#
#  Nginx'te `add_header` miras alınmadığı için buradaki liste ana
#  listenin kopyası; tek fark script/style kaynakları.
#
#  ⚠️ ÜRETİM NOTU: Gerçek bir kurulumda en doğrusu Swagger'ı tamamen
#  KAPATMAKTIR (FastAPI'de `docs_url=None, redoc_url=None`). Açık
#  dokümantasyon, saldırgana bütün uç haritasını, parametre adlarını ve
#  örnek gövdeleri hazır verir. Bu projede açık bırakıldı çünkü ödevin
#  değerlendirilmesi Swagger üzerinden yapılıyor.
# ============================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

# Farklar: script-src ve style-src'ye jsdelivr + 'unsafe-inline' eklendi,
# img-src'ye Swagger'ın favicon adresi eklendi.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.jsdelivr.net; connect-src 'self'" always;
