# ============================================================
#  Güvenlik başlıkları
#
#  Neden ayrı dosya?
#  Nginx'te `add_header` MİRAS ALINMAZ: bir `location` bloğunun içinde
#  tek bir `add_header` varsa, üst bloktaki bütün başlıklar o location
#  için sessizce kaybolur. Bizim `location /` bloğunda zaten
#  `Cache-Control` ekleniyor — yani başlıkları sadece server seviyesine
#  yazsaydık ana sayfada hiç görünmezlerdi.
#  Bu yüzden hepsi burada toplandı ve her location'a `include` ediliyor.
#
#  `always`: hata yanıtlarında (404, 500) da gönderilsin.
# ============================================================

# Sayfamız başka bir sitenin çerçevesine (iframe) konulamasın.
# Clickjacking'i engeller: saldırgan siteyi görünmez bir çerçeveye alıp
# kullanıcının tıklamalarını kendi istediği düğmelere yönlendiremez.
add_header X-Frame-Options "DENY" always;

# Tarayıcı, dosya türünü tahmin etmeye çalışmasın; sunucunun söylediğine
# uysun. Aksi halde metin gibi görünen bir yüklenti tarayıcıda script
# olarak çalıştırılabilir.
add_header X-Content-Type-Options "nosniff" always;

# Başka siteye geçerken tam adres (içinde varlık kimliği olabilir)
# sızmasın; sadece alan adı gönderilsin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Kullanmadığımız donanım izinleri baştan kapalı olsun.
# Not: konum iznini KAPATMIYORUZ, "Konumumu bul" özelliği onu kullanıyor.
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

# --- İçerik Güvenlik Politikası (CSP) ---
# XSS'e karşı en güçlü katman: saldırgan sayfaya script sokmayı başarsa
# bile, tarayıcı listede olmayan bir kaynaktan kod çalıştırmaz.
#
# Listedekilerin neden gerektiği:
#   worker-src blob:  → MapLibre arka plan işçisini blob olarak da başlatabiliyor
#   style-src inline  → React'in `style={{...}}` özellikleri satır içi stil üretir
#   img-src  data:    → tip ikonlarını SVG'den data: URI ile üretiyoruz
#   cartocdn          → harita altlığı, karolar ve yazı tipi glifleri
#   nominatim         → adres arama (B4)
# 'unsafe-inline' sadece STİL için var; script için YOK — asıl risk oradadır.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://nominatim.openstreetmap.org" always;

# HSTS bilerek eklenmedi: bu kurulum HTTP üzerinden çalışıyor.
# HTTPS'e geçildiğinde şu satır açılmalı:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
