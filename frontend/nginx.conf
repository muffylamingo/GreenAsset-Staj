server {
    listen 80;
    # IPv6 de dinlensin. Bu satır olmadan container içinden "localhost"
    # isteği başarısız oluyordu: localhost önce ::1'e (IPv6) çözümleniyor,
    # Nginx ise sadece IPv4 dinlediği için bağlantı reddediliyordu.
    # (Aynı hatayı geliştirme sunucusunda da yaşamıştık — bkz. BILMEM-GEREKENLER.md)
    listen [::]:80;
    server_name _;

    # Yanıtlarda "nginx/1.31.3" yazmasın. Sürüm bilgisi saldırgana
    # "bu sürümün bilinen açığı var mı?" diye bakma imkânı verir.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Sıkıştırma: JS paketi ~1.4 MB, gzip ile ~400 KB'a iniyor
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/geo+json;
    gzip_min_length 1024;

    # --- API isteklerini backend'e yönlendir ---
    #
    # Geliştirmede bu işi Vite'ın proxy'si yapıyordu (vite.config.js).
    # Üretimde Vite yok, o yüzden aynı işi Nginx yapıyor.
    #
    # Faydası: tarayıcı her şeyi TEK origin'den görüyor → CORS gerekmiyor,
    # üstelik backend'in portu dışarı hiç açılmasa da çalışır.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dışa aktarma büyük dosya üretebilir
        proxy_read_timeout 120s;
    }

    # --- Swagger / API dokümantasyonu ---
    #
    # Bunlar olmadan http://localhost:3000/docs adresi Swagger'ı DEĞİL,
    # React uygulamasını açıyordu: /docs diye bir dosya yok, aşağıdaki SPA
    # kuralı da bulunamayan her yolu index.html'e yönlendiriyor. Yani sayfa
    # "çalışıyor" ama yanlış şeyi gösteriyor — sessiz ve kafa karıştırıcı.
    #
    # Artık her şey tek adresten: uygulama da, dokümantasyon da 3000'de.
    # (openapi.json şart: Swagger arayüzü şemayı oradan okuyor.)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        # Swagger'a özel başlıklar: kendi dosyalarını CDN'den yüklediği için
        # ana CSP onu engelliyordu (sayfa açılıyor ama arayüz hiç çizilmiyordu).
        include /etc/nginx/security-headers-docs.conf;
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Statik varlıklar: uzun süre önbellekte kalsın ---
    # Vite dosya adına içerik özeti ekliyor (index-a1b2c3.js), bu yüzden
    # içerik değişince dosya adı da değişir; eski adı sonsuza kadar
    # önbelleğe almak güvenli.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA yönlendirmesi ---
    # Tek sayfa uygulamasında /varliklar diye gerçek bir dosya yok.
    # Bulunamayan her yolu index.html'e veriyoruz, yönlendirmeyi React yapıyor.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        # index.html önbelleğe alınmamalı: yeni sürüm çıkınca kullanıcı
        # eski dosya adlarına bakmaya devam eder
        add_header Cache-Control "no-cache";
    }
}
